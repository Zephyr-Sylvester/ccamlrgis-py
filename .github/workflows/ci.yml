name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package with all extras
        run: python -m pip install -e ".[dev,plot,progress]"

      # The test suite must not depend on the network (design doc section
      # 1.3) -- network-marked tests hit the live CCAMLR WFS and this
      # project's own GitHub Release, both external to this repo, so they
      # are opt-in only and not part of the default CI gate.
      - name: Run offline test suite
        run: pytest tests/ -v -m "not network"

  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src/ tests/ tools/
      - run: ruff format --check src/ tests/ tools/

  typecheck:
    # Blocking: the whole package (19 source files, ~2600 lines) is fully
    # annotated and mypy --strict clean, per the design doc's G5 release
    # gate. Third-party geospatial libraries without stubs (geopandas,
    # pandas, shapely, rasterio, rioxarray, xarray, mpl_toolkits, pyproj)
    # are exempted per-module in pyproject.toml -- our own code is still
    # checked at full strictness.
    name: typecheck (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev,plot,progress]"
      - run: mypy --strict src/ccamlrgis

  notebooks:
    # Non-blocking: every notebook under notebooks/ recreates a README
    # figure and, like the network-marked pytest tests, hits the live
    # CCAMLR WFS and/or this project's own GitHub Release -- external
    # services this repo doesn't control the uptime of, so a transient
    # failure here shouldn't block merges. --nbval-lax executes every
    # cell and fails on raised exceptions, but (unlike plain --nbval)
    # doesn't diff cell outputs, since the embedded plots are non-
    # deterministic (live data, RNG-seeded station picks, colour ramps).
    name: notebooks (nbval, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev,plot,progress,notebooks]"
      - run: pytest --nbval-lax notebooks/ -v
