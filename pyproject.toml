[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ccamlrgis"
version = "0.1.0.dev0"
description = "Unofficial Python port of the CCAMLRGIS R package for Antarctic spatial data"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
dependencies = [
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj",
    "rasterio",
    "pandas",
    "numpy",
    "requests",
    "platformdirs",
]

[project.optional-dependencies]
plot = ["matplotlib"]
progress = ["tqdm"]
dev = ["pytest", "pytest-cov", "mypy", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/ccamlrgis"]

[tool.pytest.ini_options]
markers = ["network: tests that require internet access"]
