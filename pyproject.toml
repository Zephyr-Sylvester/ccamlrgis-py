[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ccamlrgis"
version = "0.1.0.dev0"
description = "Unofficial Python port of the CCAMLRGIS R package for Antarctic spatial data"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
dependencies = [
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj",
    "rasterio",
    "rioxarray",
    "xarray",
    "pandas",
    "numpy",
    "requests",
    "platformdirs",
]

[project.optional-dependencies]
plot = ["matplotlib"]
progress = ["tqdm"]
dev = ["pytest", "pytest-cov", "mypy", "ruff"]
notebooks = ["jupyter", "nbval"]

[tool.hatch.build.targets.wheel]
packages = ["src/ccamlrgis"]

[tool.pytest.ini_options]
markers = ["network: tests that require internet access"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
# None of these ship type stubs (or a py.typed marker) for the submodules
# this package uses -- geospatial-stack gap, not something to work around
# by installing e.g. pandas-stubs (known to fight geopandas' own dynamic
# typing). Our own code is still checked at --strict; this only stops
# mypy complaining about the libraries themselves being untyped.
module = ["geopandas.*", "pandas.*", "shapely.*", "rasterio.*", "rioxarray.*", "xarray.*", "mpl_toolkits.*", "pyproj.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "RUF", "SIM"]
