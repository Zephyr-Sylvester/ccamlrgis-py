name: ccamlrgis-py
channels:
  - conda-forge
  - nodefaults
channel_priority: strict
dependencies:
  - python=3.11
  # --- core runtime (compiled geospatial stack: conda-forge, not pip) ---
  - geopandas>=1.0
  - shapely>=2.0
  - pyproj
  - rasterio
  - rioxarray
  - xarray
  - gdal
  - libgdal
  - pandas
  - numpy
  - requests
  - platformdirs
  # --- optional extras ---
  - matplotlib-base   # [plot] extra; -base skips the Qt pull-in
  - tqdm              # [progress] extra
  # --- dev / build-time tooling (tools/build_datasets.py only; not a package runtime dep) ---
  - rdata             # pure-Python .RData/.rda reader, confirmed on conda-forge
  # --- dev / test / lint / docs tooling ---
  - pytest
  - pytest-cov
  - pytest-mpl
  - mypy
  - ruff
  - jupyterlab
  - ipykernel
  - nbval
  - pip
  - pip:
      - -e .
